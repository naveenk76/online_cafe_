<!DOCTYPE html>
<html>
<head>
<title>Cafe Hub</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark navbar-expand-lg px-3">

    <a class="navbar-brand" href="/">CafeHub</a>

    <!-- Mobile toggle button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <!-- MENU -->
    <div class="collapse navbar-collapse" id="navMenu">

        <div class="ms-auto d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0">

            <a class="btn btn-outline-light" href="/cart">Cart</a>
            <a class="btn btn-outline-light" href="/orders">Orders</a>

            {% if current_user.is_authenticated %}
                <a class="btn btn-warning" href="/logout">Logout</a>
            {% else %}
                <a class="btn btn-warning" href="/login">Login</a>
            {% endif %}

        </div>

    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mt-4">

    {% with messages=get_flashed_messages() %}
    {% if messages %}
    <div class="alert alert-info">
        {% for m in messages %} {{m}} <br> {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

<!-- Bootstrap JS (IMPORTANT for mobile menu) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
