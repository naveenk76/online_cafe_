{% extends 'layout.html' %}
{% block content %}

<div class="container cart-container">

    <h3 class="cart-title">🛒 Your Cart</h3>

    {% if foods|length == 0 %}
        <p class="empty-cart">Your cart is empty.</p>
    {% else %}

        <div class="cart-items">
            {% for f in foods %}
            <div class="cart-item">
                <div class="item-name">{{ f.name }}</div>
                <div class="item-qty">Qty: {{ f.qty }}</div>
                <div class="item-subtotal">₹{{ f.subtotal }}</div>
            </div>
            {% endfor %}
        </div>

        <div class="cart-summary">
            <h4>Total: ₹{{ total }}</h4>
            <a class="btn btn-success checkout-btn" href="/checkout">Checkout</a>
        </div>

    {% endif %}

</div>

{% endblock %}
